[package]
name = "flummox"
description = "Compress your game library and keep playing it"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bybrooklyn/flummox"
authors = ["Flummox contributors"]

[features]
default = []
# The window stack is about 135 of the crates in the lock file and needs X and
# Wayland headers. A headless CLI user should not have to install either, so
# the GUI is opt in. CI must pass --all-features or the GUI stops being built,
# tested and linted.
gui = ["dep:iced"]

[[bin]]
name = "flummox"
path = "src/bin/flummox.rs"

[[bin]]
name = "flummox-gui"
path = "src/bin/flummox-gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
walkdir = "2"
rayon = "1"
nix = { version = "0.31", features = ["fs", "ioctl", "user"] }
libc = "0.2"
# openat2 with RESOLVE_BENEATH and RESOLVE_NO_SYMLINKS, so a swapped symlink
# cannot redirect a job outside the install directory.
rustix = { version = "1", features = ["fs"] }
# Landlock lets an unprivileged process drop its own filesystem rights.
landlock = "0.4"
xattr = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
humansize = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.3"
iced = { version = "=0.14.0", optional = true }

[dev-dependencies]
tempfile = "3"
# The VDF parser reads files Steam writes, not files we write. Its robustness
# against arbitrary input is a property, not a list of examples.
proptest = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
exit = "deny"
mem_forget = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
missing_panics_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.dev]
panic = "abort"
debug = "line-tables-only"

# zstd at high levels is painfully slow unoptimised, and the tests compress
# real data.
[profile.dev.package.zstd-sys]
opt-level = 3
