[package]
name = "flummox"
description = "Compress your game library and keep playing it"
version = "0.0.2"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bybrooklyn/flummox"
authors = ["Flummox contributors"]

[features]
default = []
# The window stack is about 135 of the crates in the lock file and needs X and
# Wayland headers. A headless CLI user should not have to install either, so
# the GUI is opt in. CI must pass --all-features or the GUI stops being built,
# tested and linted.
gui = ["dep:iced", "dep:image"]
pack-mount = ["dep:fuser"]

[[bin]]
name = "flummox"
path = "src/bin/flummox.rs"

[[bin]]
name = "flummox-gui"
path = "src/bin/flummox-gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zstd = "0.14.0"
blake3 = "1.8.7"
sha2 = "0.11.0"
tempfile = "3.27.0"
walkdir = "2.5.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
humansize = "2.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
signal-hook = "0.4.4"
iced = { version = "=0.14.0", optional = true, features = ["image-without-codecs", "advanced"] }

image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18.0", optional = true, default-features = false }
nix = { version = "0.31.3", features = ["fs", "ioctl", "user"] }
libc = "0.2.190"
# openat2 with RESOLVE_BENEATH and RESOLVE_NO_SYMLINKS, so a swapped symlink
# cannot redirect a job outside the install directory.
# `event` adds no dependencies. The download watcher needs poll: signal-hook
# registers with SA_RESTART, so a blocking read is resumed after a signal and
# would never see the flag asking it to stop.
rustix = { version = "1.1.5", features = ["fs", "event"] }
# Landlock lets an unprivileged process drop its own filesystem rights.
landlock = "0.4.7"
xattr = "1.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"
xattr = "1.6.1"

[dev-dependencies]
# The VDF parser reads files Steam writes, not files we write. Its robustness
# against arbitrary input is a property, not a list of examples.
proptest = "1.11.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
exit = "deny"
mem_forget = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
missing_panics_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.dev]
panic = "abort"
debug = "line-tables-only"

# zstd at high levels is painfully slow unoptimised, and the tests compress
# real data.
[profile.dev.package.zstd-sys]
opt-level = 3

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Render the real desktop widgets without a display server for SSH review.
iced_tiny_skia = { version = "0.14.1", features = ["image"] }
# Iced 0.14 uses tiny-skia 0.11 types in its offscreen renderer.
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
