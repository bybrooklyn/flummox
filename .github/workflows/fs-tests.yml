name: Filesystem tests

# Called by ci.yml and by release.yml, so the btrfs and FUSE tests have run on
# a commit before it is released.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fs-matrix:
    name: Filesystem matrix (btrfs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      # A loop-mounted image is the only way to exercise the real defrag ioctl
      # and the FIEMAP reader on a runner. Mounting needs root, which is why
      # this is a separate job.
      - name: Make a btrfs filesystem to test against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs
          truncate -s 2G /tmp/btrfs.img
          mkfs.btrfs -q /tmp/btrfs.img
          mkdir -p /tmp/btrfs
          sudo mount -o loop,compress=zstd:1 /tmp/btrfs.img /tmp/btrfs
          sudo chown "$(id -u):$(id -g)" /tmp/btrfs

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # These tests create their temporary directories inside the current
      # directory, so the script runs them from the mount. It sets
      # FLUMMOX_REQUIRE_BTRFS so a test that finds another filesystem fails,
      # and it requires a minimum passed count from every run.
      - name: Run the btrfs-sensitive tests on btrfs
        run: python3 packaging/btrfs-tests.py --mount /tmp/btrfs

  pack-mount:
    name: Compressed store mount and executable reads
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Enable unprivileged FUSE mounts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3
          sudo modprobe fuse
          test -c /dev/fuse
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Require mounted reads and fixture execution
        env:
          FLUMMOX_REQUIRE_FUSE: '1'
        run: |
          cargo test --features pack-mount --test pack_mount --test jobs_lifecycle -- --nocapture
          cargo test --features pack-mount --lib -- --nocapture pack::
