name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo 'tag=' >> "$GITHUB_OUTPUT"
          fi
      - id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python packaging/prepare-release.py --tag "$TAG"
      - name: Require recorded game acceptance for tag publication
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python packaging/check-acceptance.py --version "$VERSION"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes
          path: RELEASE-NOTES.md

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: windows-2025
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply tag version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python packaging/prepare-release.py --tag "$TAG"
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev libfontconfig1-dev desktop-file-utils minisign
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --component clippy --target "$TARGET"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Lint
        env:
          TARGET: ${{ matrix.target }}
        run: cargo clippy --locked --all-features --all-targets --target "$TARGET" -- -D warnings
      - name: Test
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --all-features --target "$TARGET"
      - uses: taiki-e/install-action@v2.87.22
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        with:
          tool: just,cargo-deny
      - name: Dependency and prose policy
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        run: |
          just deny prose
          python packaging/test_release.py
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --all-features --bins --target "$TARGET"
      - name: Verify binary version
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          suffix=''
          if [ "$PLATFORM" = windows ]; then suffix=.exe; fi
          actual=$("target/$TARGET/release/flummox$suffix" --version)
          test "$actual" = "flummox $VERSION"
      - name: Compile Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (!$compiler) { throw 'ISCC.exe is missing' }
          & $compiler.FullName "/DAppVersion=$env:VERSION" "/DAppNumericVersion=$($env:VERSION.Split('-')[0])" "/DSourceDir=$env:GITHUB_WORKSPACE\target\$env:TARGET\release" packaging/windows/flummox.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Bundle release files
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: python packaging/package-release.py --platform "$PLATFORM" --arch "$ARCH" --binaries "target/$TARGET/release"
      - name: Check Linux desktop entry
        if: matrix.platform == 'linux'
        run: desktop-file-validate packaging/flummox.desktop
      - name: Test Windows install, upgrade, and uninstall
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $installer = (Resolve-Path "dist/flummox-$env:VERSION-windows-x86_64-setup.exe").Path
          $destination = "$env:RUNNER_TEMP\Flummox installation"
          1..2 | ForEach-Object {
            $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Install failed: $($process.ExitCode)" }
            $actual = & "$destination\flummox.exe" --version
            if ($actual -ne "flummox $env:VERSION") { throw "Unexpected installed version: $actual" }
          }
          $process = Start-Process -FilePath "$destination\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$destination\flummox.exe")) { throw 'Uninstall failed' }
      - name: Verify macOS app bundle
        if: matrix.platform == 'macos'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ditto -x -k "dist/flummox-$VERSION-macos-aarch64.zip" "$RUNNER_TEMP/mac-app"
          codesign --verify --deep --strict "$RUNNER_TEMP/mac-app/Flummox.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/mac-app/Flummox.app/Contents/Info.plist")" = "${VERSION%%-*}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: flummox-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.xz
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256
            dist/*-sizes.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        if: matrix.platform == 'linux'
        with:
          name: debug-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-debug/
          retention-days: 14
          if-no-files-found: error

  arch:
    name: Arch package and install checks
    needs: [prepare, build]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - name: Install packaging dependencies
        run: pacman -Syu --noconfirm --needed base-devel git python
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: flummox-*
          merge-multiple: true
          path: dist
      - name: Generate package recipes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python packaging/distributions.py --version "$VERSION"
      - name: Build Arch package from verified archives
        run: |
          cp dist/*.tar.xz dist/recipes/aur/flummox-bin/
          useradd -m builder
          chown -R builder dist
          runuser -u builder -- bash -c 'cd dist/recipes/aur/flummox-bin && makepkg --force --nodeps'
          runuser -u builder -- bash -c 'cd dist/recipes/aur/flummox-bin && makepkg --printsrcinfo' > /tmp/actual-srcinfo
          python - <<'PY'
          from pathlib import Path
          actual = sorted(line.strip() for line in Path('/tmp/actual-srcinfo').read_text().splitlines() if line.strip())
          expected = sorted(line.strip() for line in Path('dist/recipes/aur/flummox-bin/.SRCINFO').read_text().splitlines() if line.strip())
          if actual != expected:
              raise SystemExit('Generated .SRCINFO differs from makepkg output')
          PY
          cp dist/recipes/aur/flummox-bin/*.pkg.tar.zst dist/
          cd dist
          sha256sum *.pkg.tar.zst > arch-package.sha256
      - name: Test Arch installation, upgrade, and GUI
        run: |
          mkdir -p /validation
          bash packaging/smoke-arch.sh dist/flummox-bin-*-x86_64.pkg.tar.zst
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: flummox-packages
          path: |
            dist/*.pkg.tar.zst
            dist/arch-package.sha256
            dist/recipes/aur/flummox-bin/PKGBUILD
            dist/recipes/aur/flummox-bin/.SRCINFO
            dist/recipes/homebrew/Casks/flummox.rb
          include-hidden-files: true
          if-no-files-found: error

  homebrew-check:
    name: Homebrew install and uninstall
    needs: [prepare, build]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: flummox-*
          merge-multiple: true
          path: dist
      - name: Validate the cask against built artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python packaging/distributions.py --version "$VERSION"
          ruby -c dist/recipes/homebrew/Casks/flummox.rb
          python - <<'PY'
          import os
          from pathlib import Path
          recipe = Path('dist/recipes/homebrew/Casks/flummox.rb')
          version = os.environ['VERSION']
          url = f'https://github.com/bybrooklyn/flummox/releases/download/v{version}/flummox-{version}-macos-aarch64.zip'
          archive = Path(f'dist/flummox-{version}-macos-aarch64.zip').resolve().as_uri()
          recipe.write_text(recipe.read_text().replace(url, archive))
          PY
          git -C dist/recipes/homebrew init
          git -C dist/recipes/homebrew add Casks
          git -C dist/recipes/homebrew -c user.name=CI -c user.email=ci@example.com commit -m 'Test release cask'
          brew tap bybrooklyn/flummox-test "$PWD/dist/recipes/homebrew"
          brew install --cask bybrooklyn/flummox-test/flummox
          test -d /Applications/Flummox.app
          brew uninstall --cask bybrooklyn/flummox-test/flummox
          test ! -d /Applications/Flummox.app
          brew untap bybrooklyn/flummox-test

  sign:
    name: Sign and verify finalized downloads
    needs: [prepare, build, arch, homebrew-check]
    if: >-
      always() && needs.prepare.result == 'success' && needs.build.result == 'success' &&
      (needs.arch.result == 'success' || needs.arch.result == 'skipped') &&
      (needs.homebrew-check.result == 'success' || needs.homebrew-check.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: flummox-*
          merge-multiple: true
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          secret = os.environ.pop('RELEASE_SIGNING_KEY')
          if not secret:
              raise SystemExit('RELEASE_SIGNING_KEY is missing')
          with tempfile.NamedTemporaryFile(mode='w', prefix='flummox-signing-') as key:
              key.write(secret)
              key.flush()
              subprocess.run(['python', 'packaging/release-manifest.py', 'sign', '--version', os.environ['VERSION'], '--commit', os.environ['GITHUB_SHA'], '--key', key.name], check=True)
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: flummox-manifest
          path: |
            dist/*-manifest.json
            dist/*-manifest.json.minisig
          if-no-files-found: error

  publish:
    name: Publish tagged release
    needs: [prepare, build, arch, homebrew-check, sign]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') && needs.sign.result == 'success' &&
      needs.prepare.result == 'success' && needs.build.result == 'success' &&
      (needs.arch.result == 'success' || needs.arch.result == 'skipped') &&
      (needs.homebrew-check.result == 'success' || needs.homebrew-check.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: flummox-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-notes
          path: notes
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify signed downloads and include public key
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python packaging/release-manifest.py verify --version "$VERSION" --commit "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import os
          notes = Path('notes/RELEASE-NOTES.md')
          key = Path('packaging/minisign.pub').read_text().splitlines()[-1]
          version = os.environ['VERSION']
          with notes.open('a') as output:
              output.write(f'\n## Verify downloads\n\nRelease public key: `{key}`\n\nVerify the manifest with `minisign -Vm flummox-{version}-manifest.json -P {key}`, then compare your download against its signed SHA-256 digest. The manifest authenticates all downloads.\n')
          PY
      - name: Publish with changelog and download digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); fi
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name '*.tar.xz' -o -name '*.zip' -o -name '*-setup.exe' -o -name '*.pkg.tar.zst' -o -name '*-manifest.json' -o -name '*-manifest.json.minisig' \) | sort)
          # Create as draft so an interrupted upload never exposes a partial release.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Flummox $VERSION" --notes-file notes/RELEASE-NOTES.md
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --draft=false --title "Flummox $VERSION" --notes-file notes/RELEASE-NOTES.md "${args[@]}"

  channels:
    name: Update Homebrew and AUR
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: flummox-*
          merge-multiple: true
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify signed downloads before channel updates
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python packaging/release-manifest.py verify --version "$VERSION" --commit "$GITHUB_SHA"
      - name: Generate pinned recipes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python packaging/distributions.py --version "$VERSION"
      - name: Update Homebrew tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_DEPLOY_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python packaging/publish-channel.py homebrew --version "$VERSION"
      - name: Update AUR
        env:
          DEPLOY_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python packaging/publish-channel.py aur --version "$VERSION"
