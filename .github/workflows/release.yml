name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux x86_64 release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Release tag must match Cargo.toml version')
          PY
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev libfontconfig1-dev desktop-file-utils
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@v2
      - name: Validate
        run: just ci
      - name: Build the release archive
        run: just release
      - name: Smoke test the bundle
        run: |
          cd dist
          sha256sum -c *.sha256
          tar -xJf *.tar.xz
          ./flummox-*/bin/flummox --version
          desktop-file-validate ./flummox-*/share/applications/flummox.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: flummox-linux-x86_64
          path: |
            dist/*.tar.xz
            dist/*.sha256
          if-no-files-found: error

  arch:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel rust git python \
            libxkbcommon libxkbcommon-x11 wayland libx11 libxcursor libxi libxrandr fontconfig
      - uses: actions/checkout@v5
      - name: Verify package versions
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          package = pathlib.Path('packaging/PKGBUILD').read_text()
          if re.search(r'^pkgver=(.+)$', package, re.M).group(1) != version:
              raise SystemExit('Arch package version must match Cargo.toml')
          if os.environ['GITHUB_REF'].startswith('refs/tags/') and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Release tag must match Cargo.toml')
          PY
      - name: Build and test the Arch package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c 'cd packaging && makepkg --force --nodeps'
          cd packaging
          for package in *.pkg.tar.zst; do
            sha256sum "$package" > "$package.sha256"
          done
      - name: Check clean install, upgrade, and GUI startup
        run: |
          mkdir -p /validation
          bash packaging/smoke-arch.sh packaging/flummox-*-x86_64.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: flummox-arch-x86_64
          path: |
            packaging/*.pkg.tar.zst
            packaging/*.pkg.tar.zst.sha256
          if-no-files-found: error

  draft:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: flummox-*
          merge-multiple: true
          path: dist
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.xz dist/*.pkg.tar.zst dist/*.sha256 \
            --verify-tag --draft --generate-notes \
            --title "Flummox $GITHUB_REF_NAME"
