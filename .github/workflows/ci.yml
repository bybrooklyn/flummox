name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning that only appears in CI is a warning nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      # The GUI links against the system's windowing, rendering and font
      # libraries; without these the workspace builds everywhere except the
      # one crate a user actually looks at.
      - name: Install the GUI's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-features --all-targets

      # The btrfs-specific tests check the filesystem they are running on and
      # skip themselves elsewhere, so this is honest but not complete: the
      # ioctl paths are only really exercised on a btrfs machine. See the
      # `fs-matrix` job below.
      - name: Test
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fs-matrix:
    name: Filesystem matrix (btrfs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      # A loop-mounted image is the only way to exercise the real defrag
      # ioctl and the FIEMAP reader on a runner. Mounting needs root, which is
      # why this is a separate job rather than part of the test run.
      - name: Make a btrfs filesystem to test against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs
          truncate -s 2G /tmp/btrfs.img
          mkfs.btrfs -q /tmp/btrfs.img
          mkdir -p /tmp/btrfs
          sudo mount -o loop,compress=zstd:1 /tmp/btrfs.img /tmp/btrfs
          sudo chown "$(id -u):$(id -g)" /tmp/btrfs

      - uses: Swatinem/rust-cache@v2

      # The tests that need btrfs create their temporary directories inside
      # the current directory, so running from the mount is what selects them.
      - name: Run the backend tests on btrfs
        run: |
          cargo build --tests -p flummox
          cd /tmp/btrfs
          cargo test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p flummox backend::btrfs
