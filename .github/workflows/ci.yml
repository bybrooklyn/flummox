name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes, so the token only needs to read the code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning that only appears in CI is a warning nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows native app
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Lint Windows code and tests
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test on Windows
        env:
          FLUMMOX_NATIVE_PREVIEW_DIR: ${{ runner.temp }}/flummox-previews
        run: cargo test --locked --all-features
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-desktop-previews
          path: ${{ runner.temp }}/flummox-previews
          if-no-files-found: warn
      - name: Build the Windows CLI and GUI
        run: cargo build --locked --release --all-features --bins

      - name: Prepare installer release notes
        run: python packaging/prepare-release.py
      - name: Compile and smoke-test the Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($LASTEXITCODE -ne 0) { throw 'Package metadata failed' }
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (!$compiler) { throw 'ISCC.exe is missing' }
          & $compiler.FullName "/DAppVersion=$version" "/DAppNumericVersion=$($version.Split('-')[0])" "/DSourceDir=$env:GITHUB_WORKSPACE\target\release" packaging/windows/flummox.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = (Resolve-Path "dist/flummox-$version-windows-x86_64-setup.exe").Path
          $destination = "$env:RUNNER_TEMP\Flummox installation"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\Flummox installer state"
          1..2 | ForEach-Object {
            $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Install failed: $($process.ExitCode)" }
            $actual = & "$destination\flummox.exe" --version
            if ($LASTEXITCODE -ne 0 -or $actual -ne "flummox $version") { throw "Unexpected installed version: $actual" }
          }
          $process = Start-Process -FilePath "$destination\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$destination\flummox.exe")) { throw 'Uninstall failed' }

  macos:
    name: macOS native APFS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check every target with warnings denied
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test portable modules
        env:
          FLUMMOX_NATIVE_PREVIEW_DIR: ${{ runner.temp }}/flummox-previews
        run: cargo test --locked --all-features
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-desktop-previews
          path: ${{ runner.temp }}/flummox-previews
          if-no-files-found: warn
      - name: Build CLI and GUI
        run: cargo build --locked --release --all-features --bins

  check:
    name: Build, test, lint and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      # The GUI links against the system's windowing, rendering and font
      # libraries. Without these everything builds except the one binary a
      # user actually looks at.
      - name: Install the GUI's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev libfontconfig1-dev minisign

      # CI runs the same recipes the pre-push hook runs. While CI called cargo
      # directly the two drifted, and a licence failure reached main because
      # the local checks and the remote ones were not the same checks.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just,cargo-deny

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # lint, then test, then the dependency policy.
      - name: just ci
        run: just ci

  fs-matrix:
    name: Filesystem matrix (btrfs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      # A loop-mounted image is the only way to exercise the real defrag ioctl
      # and the FIEMAP reader on a runner. Mounting needs root, which is why
      # this is a separate job.
      - name: Make a btrfs filesystem to test against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs
          truncate -s 2G /tmp/btrfs.img
          mkfs.btrfs -q /tmp/btrfs.img
          mkdir -p /tmp/btrfs
          sudo mount -o loop,compress=zstd:1 /tmp/btrfs.img /tmp/btrfs
          sudo chown "$(id -u):$(id -g)" /tmp/btrfs

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # These tests create their temporary directories inside the current
      # directory, so running from the mount is what selects them. Anywhere
      # else they skip themselves, which would make a green run misleading.
      - name: Run the backend tests on btrfs
        run: |
          cargo test --no-run --message-format=json > /tmp/flummox-test-build.jsonl
          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open('/tmp/flummox-test-build.jsonl') as build:
              artifacts = [json.loads(line) for line in build]
          tests = [item for item in artifacts
                   if item.get('reason') == 'compiler-artifact'
                   and item.get('profile', {}).get('test')
                   and item.get('executable')
                   and (item['target']['kind'] == ['lib']
                        or item['target']['name'] == 'jobs_lifecycle')]
          if len(tests) != 2:
              raise RuntimeError('Expected library and coordinator lifecycle test executables')
          # Cargo sets test cwd to the package root. Invoke the artifacts directly
          # so their temporary files actually live on the mounted filesystem.
          os.chdir('/tmp/btrfs')
          for test in tests:
              args = [test['executable']]
              if test['target']['kind'] == ['lib']:
                  args.append('backend::btrfs')
              result = subprocess.run(args + ['--nocapture'], text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout)
              result.check_returncode()
              if 'skipped:' in result.stdout:
                  raise RuntimeError('A required native filesystem test was skipped')
          PY

  pack-mount:
    name: Compressed store mount and executable reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Enable unprivileged FUSE mounts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3
          sudo modprobe fuse
          test -c /dev/fuse
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Require mounted reads and fixture execution
        env:
          FLUMMOX_REQUIRE_FUSE: '1'
        run: cargo test --features pack-mount --test pack_mount --test jobs_lifecycle -- --nocapture
