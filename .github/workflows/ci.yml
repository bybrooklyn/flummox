name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning that only appears in CI is a warning nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows native app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the Windows CLI and GUI
        run: cargo xwin build --release --target x86_64-pc-windows-msvc --features gui --bins

  check:
    name: Build, test, lint and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      # The GUI links against the system's windowing, rendering and font
      # libraries. Without these everything builds except the one binary a
      # user actually looks at.
      - name: Install the GUI's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libfontconfig1-dev

      # CI runs the same recipes the pre-push hook runs. While CI called cargo
      # directly the two drifted, and a licence failure reached main because
      # the local checks and the remote ones were not the same checks.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny

      - uses: Swatinem/rust-cache@v2

      # lint, then test, then the dependency policy.
      - name: just ci
        run: just ci

  fs-matrix:
    name: Filesystem matrix (btrfs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      # A loop-mounted image is the only way to exercise the real defrag ioctl
      # and the FIEMAP reader on a runner. Mounting needs root, which is why
      # this is a separate job.
      - name: Make a btrfs filesystem to test against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs
          truncate -s 2G /tmp/btrfs.img
          mkfs.btrfs -q /tmp/btrfs.img
          mkdir -p /tmp/btrfs
          sudo mount -o loop,compress=zstd:1 /tmp/btrfs.img /tmp/btrfs
          sudo chown "$(id -u):$(id -g)" /tmp/btrfs

      - uses: Swatinem/rust-cache@v2

      # These tests create their temporary directories inside the current
      # directory, so running from the mount is what selects them. Anywhere
      # else they skip themselves, which would make a green run misleading.
      - name: Run the backend tests on btrfs
        run: |
          cargo test --no-run --message-format=json > /tmp/flummox-test-build.jsonl
          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open('/tmp/flummox-test-build.jsonl') as build:
              artifacts = [json.loads(line) for line in build]
          tests = [item for item in artifacts
                   if item.get('reason') == 'compiler-artifact'
                   and item.get('profile', {}).get('test')
                   and item.get('executable')
                   and (item['target']['kind'] == ['lib']
                        or item['target']['name'] == 'jobs_lifecycle')]
          if len(tests) != 2:
              raise RuntimeError('Expected library and coordinator lifecycle test executables')
          # Cargo sets test cwd to the package root. Invoke the artifacts directly
          # so their temporary files actually live on the mounted filesystem.
          os.chdir('/tmp/btrfs')
          for test in tests:
              args = [test['executable']]
              if test['target']['kind'] == ['lib']:
                  args.append('backend::btrfs')
              result = subprocess.run(args + ['--nocapture'], text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout)
              result.check_returncode()
              if 'skipped:' in result.stdout:
                  raise RuntimeError('A required native filesystem test was skipped')
          PY

  pack-mount:
    name: Compressed store mount and executable reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Enable unprivileged FUSE mounts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3
          sudo modprobe fuse
          test -c /dev/fuse
      - uses: Swatinem/rust-cache@v2
      - name: Require mounted reads and fixture execution
        env:
          FLUMMOX_REQUIRE_FUSE: '1'
        run: cargo test --features pack-mount --test pack_mount -- --nocapture
