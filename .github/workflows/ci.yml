name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes, so the token only needs to read the code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning that only appears in CI goes unread.
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows native app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Lint Windows code and tests
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test on Windows
        env:
          FLUMMOX_NATIVE_PREVIEW_DIR: ${{ runner.temp }}/flummox-previews
        run: cargo test --locked --all-features
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-desktop-previews
          path: ${{ runner.temp }}/flummox-previews
          if-no-files-found: warn
      - name: Build the Windows CLI and GUI
        run: cargo build --locked --release --all-features --bins

      - name: Prepare installer release notes
        run: python packaging/prepare-release.py
      - name: Compile and smoke-test the Windows installer
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($LASTEXITCODE -ne 0) { throw 'Package metadata failed' }
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (!$compiler) { throw 'ISCC.exe is missing' }
          & $compiler.FullName "/DAppVersion=$version" "/DAppNumericVersion=$($version.Split('-')[0])" "/DSourceDir=$env:GITHUB_WORKSPACE\target\release" packaging/windows/flummox.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = (Resolve-Path "dist/flummox-$version-windows-x86_64-setup.exe").Path
          $destination = "$env:RUNNER_TEMP\Flummox installation"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\Flummox installer state"
          1..2 | ForEach-Object {
            $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Install failed: $($process.ExitCode)" }
            $actual = & "$destination\flummox.exe" --version
            if ($LASTEXITCODE -ne 0 -or $actual -ne "flummox $version") { throw "Unexpected installed version: $actual" }
          }
          $process = Start-Process -FilePath "$destination\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$destination\flummox.exe")) { throw 'Uninstall failed' }

  macos:
    name: macOS native APFS app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check every target with warnings denied
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test portable modules
        env:
          FLUMMOX_NATIVE_PREVIEW_DIR: ${{ runner.temp }}/flummox-previews
        run: cargo test --locked --all-features
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-desktop-previews
          path: ${{ runner.temp }}/flummox-previews
          if-no-files-found: warn
      - name: Build CLI and GUI
        run: cargo build --locked --release --all-features --bins

  check:
    name: Build, test, lint and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      # The GUI links against the system's windowing, rendering and font
      # libraries. Without these everything builds except the one binary a
      # user actually looks at.
      - name: Install the GUI's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev libfontconfig1-dev minisign

      # CI runs the same recipe as the pre-push hook in .githooks/, which
      # `just hooks` installs. While CI called cargo directly the two drifted,
      # and a licence failure reached main because the local checks and the
      # remote ones were not the same checks.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just,cargo-deny

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # lint, then test, then the dependency policy. The Landlock tests fail
      # instead of skipping when the runner kernel has no Landlock.
      - name: just ci
        env:
          FLUMMOX_REQUIRE_LANDLOCK: '1'
        run: just ci

  # The btrfs and FUSE jobs live in a reusable workflow so a release can
  # require them too.
  fs-tests:
    name: Filesystem tests
    uses: ./.github/workflows/fs-tests.yml

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # An older compiler can warn differently, and the stable jobs already deny
    # warnings. This job answers only whether the declared version compiles.
    env:
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          echo "Checking with Rust $msrv"
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
      - name: Install the GUI's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check every target
        run: cargo check --locked --all-features --all-targets
