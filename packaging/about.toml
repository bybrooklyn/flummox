# cargo-about configuration for the third-party licence notices that ship in
# every release archive. The accepted list matches the allow list in
# deny.toml. A crate under any other licence stops the notices step.
accepted = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# One file serves every archive, so it covers the crates of all three
# platforms.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
